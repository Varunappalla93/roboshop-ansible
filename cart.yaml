- name: cart configure
  hosts: cart
  become: yes
  tasks:
    - name: disable nodejs
      ansible.builtin.command: dnf module disable nodejs -y 

    - name: enable nodejs 20
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name: install nodejs
      ansible.builtin.command: dnf install nodejs -y

    - name: create system user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "Roboshop system user"

    - name: delete existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create app directory
      ansible.builtin.file:
        path: /app
        state: directory
    
    - name: delete cart zip file
      ansible.builtin.file:
        path: /tmp/cart.zip
        state: absent

    - name: download cart app zip code
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
        dest: /tmp/cart.zip


    - name: umzip cart code into /app directory
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes


    - name: install dependencies
      community.general.npm:
        path: /app
    

    - name: copy cart service   # Jinja template
      ansible.builtin.template:
        src: cart.service
        dest: /etc/systemd/system/cart.service



    - name: start cart
      ansible.builtin.service:
        name: cart
        state: restarted
        enabled: yes