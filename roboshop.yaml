- name: create ec2 and s3 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0093e9cae22fdf09a
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    domain_name: vardevops.online
    instances:
      - mongodb
      - catalogue
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        instance_type: "t3.micro"
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        name: "{{ item }}-{{ env }}"
        tags:
          Project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
          Name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output

    - name: print the output
      ansible.builtin.debug:
        msg: " {{ ec2_output }}"


    - name: create r53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"  # mongodb-dev-vardevops.online
        type: A 
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"


    - name: create r53 roboshop public record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"  # roboshop-dev-vardevops.online
        type: A 
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when: item.item=="frontend"



# to execute playbook without using inventory.ini and use localhost directly:
# ansible-playbook -i localhost, roboshop.yaml